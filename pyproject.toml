[project]
name = "boss-emulator"
version = "0.1.0"
description = "An emulator for BOSS spectra"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "autocvd",
    "numpy",
    "gpustat",
    "jax[cuda12]",
    "matplotlib",
    "marimo",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boss_emulator"]
