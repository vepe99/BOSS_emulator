[project]
name = "boss-emulator"
version = "0.1.0"
description = "An emulator for BOSS spectra"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "autocvd",
    "numpy",
    "gpustat",
    "jax[cuda12]",
    "matplotlib",
    "marimo",
    "scipy",
    "h5py>=3.16.0",
    "flax>=0.12.8",
    "optax>=0.2.8",
    "optuna>=4.9.0",
    "numpyro>=0.21.0",
    "optimistix>=0.1.0",
]

[project.optional-dependencies]
sbi = [
    "bayesflow>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boss_emulator"]
